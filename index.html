<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ออกก่อน จ่ายทีหลัง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Mali:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>ออกก่อน จ่ายทีหลัง</h1>
    <div class="sub">ใครออกเงินไปก่อน ก็ระวังโดนบิด</div>
  </header>

  <div class="sketchy">
    <label class="trip-label" for="tripName">ชื่อทริป</label>
    <div class="trip-field" id="tripField">
      <input class="trip-name-input" id="tripName" type="text" placeholder="ตั้งชื่อทริป เช่น ทะเลหัวหิน" maxlength="60" autocomplete="off" enterkeyhint="done">
      <span class="trip-icon" id="tripIcon" aria-hidden="true">✏️</span>
    </div>
    <label>เพิ่มเพื่อนร่วมทริป</label>
    <div class="row">
      <div><input type="text" id="memberInput" placeholder="ชื่อเพื่อน เช่น แฟน"></div>
      <button class="btn primary" id="addMemberBtn" style="flex:none;">+ เพิ่ม</button>
    </div>
    <div class="chips" id="memberChips"></div>
    <div class="msg" id="memberMsg"></div>
  </div>

  <div id="panel-add" class="tabpanel active">
    <div class="sketchy">
      <div class="sec-title"><span class="num">1</span> บันทึกรายจ่าย</div>
      <label>รายการ</label>
      <input type="text" id="expDesc" placeholder="เช่น ข้าวเย็นร้านที่ 1">
      <label>จำนวนเงิน (บาท)</label>
      <input type="number" id="expAmount" placeholder="เช่น 1000" min="0" inputmode="decimal">
      <label>ใครออกเงินไปก่อน <span class="picker-hint" style="display:inline;">(เลือกได้คนเดียว 👉)</span></label>
      <div class="avatars" id="paidByPicker"></div>
      <label>ใครร่วมหารบิลนี้บ้าง <span class="picker-hint" style="display:inline;">(เลือกได้หลายคน ✓)</span></label>
      <div class="participants" id="participantsPicker"></div>
      <button class="btn primary block" id="addExpenseBtn">บันทึกรายจ่าย</button>
      <div class="msg" id="expenseMsg"></div>
    </div>

    <div class="sketchy">
      <div class="sec-title"><span class="num">2</span> รายการทั้งหมด</div>
      <div id="expenseList"></div>
    </div>
  </div>

  <div id="panel-summary" class="tabpanel">
    <div class="sketchy">
      <div class="sec-title"><span class="num">3</span> สรุปยอดแต่ละคน</div>
      <div id="ledger"></div>
    </div>
    <div class="sketchy">
      <div class="sec-title"><span class="num">4</span> ใครจ่ายให้ใคร
        <button class="btn small share-btn" id="shareImgBtn" hidden>📤 ส่งรูป</button>
      </div>
      <div id="settlements"></div>
      <div class="copy-row" id="copyRow" hidden>
        <button class="linkbtn plain" id="copyTransfersBtn">คัดลอกยอดโอน</button>
      </div>
      <button class="btn primary block" id="settleBtn">✅ ยืนยันเคลียร์บิลแล้ว</button>
      <div class="hint">กดเมื่อทุกคนโอนกันครบแล้ว ทริปนี้จะถูกเก็บไว้ใน "ทริปที่เคลียร์แล้ว" ด้านล่าง แล้วเริ่มรอบใหม่ให้</div>
    </div>

    <div class="sketchy">
      <button class="hist-toggle" id="histToggle" aria-expanded="false" aria-controls="histBody">
        <span class="sec-title"><span class="ic">🗂️</span> ทริปที่เคลียร์แล้ว</span>
        <span class="hist-count" id="histCount">0</span>
        <span class="chev">▼</span>
      </button>
      <div class="hist-body" id="histBody" hidden>
        <div id="histList"></div>
        <div class="hist-foot" id="histFoot">
          <span id="histCap"></span>
          <button class="linkbtn" id="histClearAll">ลบประวัติทั้งหมด</button>
        </div>
      </div>
    </div>

    <div class="foot-link"><button class="linkbtn" id="resetBtn">ล้างทริปที่กำลังทำอยู่</button></div>
  </div>

</div>

<nav class="tabs">
  <div class="tabs-inner">
    <button class="active" data-tab="add"><span class="ic">✏️</span>รายจ่าย</button>
    <button data-tab="summary"><span class="ic">📒</span>สรุปยอด<span class="badge" id="settleBadge"></span></button>
  </div>
</nav>

<div class="sheet-overlay" id="histSheet" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div>
        <h2 id="sheetTitle"></h2>
        <div class="sheet-date" id="sheetDate"></div>
      </div>
      <div class="head-actions">
        <button class="sheet-close" id="sheetShare" aria-label="ส่งเป็นรูป">📤</button>
        <button class="sheet-close" id="sheetClose" aria-label="ปิด">✕</button>
      </div>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="sheet-overlay" id="imgPreview" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="รูปสรุปทริป">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div><h2>รูปสรุปพร้อมส่ง</h2></div>
      <button class="sheet-close" id="previewClose" aria-label="ปิด">✕</button>
    </div>
    <div class="sheet-body">
      <p class="preview-hint">กดค้างที่รูปเพื่อบันทึกหรือแชร์เข้าไลน์</p>
      <img class="preview-img" id="previewImg" alt="รูปสรุปทริป">
      <a class="btn primary block" id="previewDownload" style="display:block;text-align:center;text-decoration:none;">บันทึกรูปลงเครื่อง</a>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button id="toastAction" hidden></button>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal-box sketchy">
    <span class="warn-icon">⚠️</span>
    <div class="modal-msg" id="confirmMsg"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="confirmCancel">ยกเลิก</button>
      <button class="btn danger" id="confirmOk">ยืนยัน</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
